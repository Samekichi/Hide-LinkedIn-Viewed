<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkedIn Viewed Jobs</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Hide LinkedIn Viewed Job Posts</h1>

      <label class="setting">
        <span>
          <strong>Auto-hide Viewed Job Posts</strong>
          <small>Persistent</small>
        </span>
        <input id="enabled" type="checkbox">
      </label>

      <label class="setting">
        <span>
          <strong>Show Hidden Job Posts</strong>
          <small>Temporary</small>
        </span>
        <input id="temporary" type="checkbox">
      </label>

      <p id="status" role="status"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
